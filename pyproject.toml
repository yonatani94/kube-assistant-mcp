[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kube-assistant-mcp"
version = "0.3.0"
description = "Agentic Kubernetes troubleshooting CLI and MCP server — natural-language cluster diagnostics with local LLMs (Ollama) or OpenAI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Yehonatan Arami", email = "yonatani94@users.noreply.github.com" }
]
keywords = ["kubernetes", "mcp", "llm", "ollama", "cli", "devops", "sre", "cursor", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Debuggers",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "kubernetes>=29.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "fastmcp>=0.2.0",
]

[project.optional-dependencies]
rag = ["qdrant-client==1.14.3"]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/yonatani94/kube-assistant-mcp"
Repository = "https://github.com/yonatani94/kube-assistant-mcp"
Issues = "https://github.com/yonatani94/kube-assistant-mcp/issues"

[project.scripts]
kube-assistant = "kube_assistant_mcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kube_assistant_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
